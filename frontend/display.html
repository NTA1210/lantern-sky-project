<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Phố Đèn Ký Ức — Display</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="display-page">
  <canvas id="sky" aria-label="Bốn dây đèn lồng kỹ thuật số"></canvas>

  <header class="festival-header" aria-label="Phố Đèn Ký Ức">
    <div class="festival-title">
      <p class="festival-kicker">VẼ ĐÈN LỒNG KĨ THUẬT SỐ</p>
      <h1>PHỐ ĐÈN KÝ ỨC</h1>
      <p>Vẽ một chiếc đèn – Treo một ký ức</p>
    </div>
    <div class="lantern-counter" aria-live="polite">
      <span>TỔNG SỐ ĐÈN LỒNG</span>
      <div><strong id="lanternTotal">0</strong><small>chiếc</small></div>
    </div>
  </header>

  <div id="displayHud" class="display-hud">
    <div><strong>Lantern Sky</strong><span id="connectionStatus">Connecting…</span></div>
    <div class="hud-actions">
      <button id="fullscreenButton" class="hud-button">Fullscreen</button>
      <button id="hideHudButton" class="hud-button">Hide controls</button>
    </div>
  </div>

  <script src="/static/display.js"></script>
</body>
</html>
