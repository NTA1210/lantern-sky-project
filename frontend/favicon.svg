<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#fff275" stop-opacity="1"/>
      <stop offset="40%" stop-color="#ff9f1c" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#e63946" stop-opacity="1"/>
      <stop offset="100%" stop-color="#9d0208" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe49e"/>
      <stop offset="50%" stop-color="#f3b33a"/>
      <stop offset="100%" stop-color="#9a6700"/>
    </linearGradient>
    <linearGradient id="tasselGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e63946"/>
      <stop offset="100%" stop-color="#720000"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Aura -->
  <circle cx="32" cy="30" r="26" fill="#ff9f1c" opacity="0.15" filter="url(#softGlow)"/>

  <!-- Top Hanging Loop & String -->
  <path d="M32 2 L32 10" stroke="url(#gold)" stroke-width="2" stroke-linecap="round"/>
  <circle cx="32" cy="4" r="2" fill="none" stroke="url(#gold)" stroke-width="1.5"/>

  <!-- Top Golden Cap -->
  <path d="M22 10 Q32 8 42 10 L40 14 Q32 13 24 14 Z" fill="url(#gold)"/>

  <!-- Main Lantern Body (Balloon/Oval Silhouette) -->
  <path d="M24 14 Q10 28 22 44 Q32 47 42 44 Q54 28 40 14 Q32 13 24 14 Z" fill="url(#glow)" filter="url(#softGlow)"/>

  <!-- Lantern Ribs (Vertical Curvature Lines) -->
  <path d="M32 13 L32 45.5" stroke="#ffe49e" stroke-width="1.2" opacity="0.65"/>
  <path d="M27 13.5 Q18 28 26 44.5" stroke="#ffe49e" stroke-width="1" fill="none" opacity="0.5"/>
  <path d="M37 13.5 Q46 28 38 44.5" stroke="#ffe49e" stroke-width="1" fill="none" opacity="0.5"/>

  <!-- Inner Radiant Light Source -->
  <ellipse cx="32" cy="28" rx="6" ry="7" fill="#ffffff" opacity="0.5" filter="url(#softGlow)"/>

  <!-- Bottom Golden Base -->
  <path d="M24 44 Q32 46.5 40 44 L38 48 Q32 49 26 48 Z" fill="url(#gold)"/>

  <!-- Hanging Jade Bead & Tassel -->
  <circle cx="32" cy="51" r="2" fill="#2a9d8f"/>
  <path d="M32 53 L32 62" stroke="url(#tasselGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M29.5 54 L30.5 61" stroke="url(#tasselGrad)" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M34.5 54 L33.5 61" stroke="url(#tasselGrad)" stroke-width="1.2" stroke-linecap="round"/>
</svg>
