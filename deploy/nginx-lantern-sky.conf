# Nginx Reverse Proxy cho Lantern Sky (Ubuntu VPS)
# Luu vao: /etc/nginx/sites-available/lantern-sky
# Sau do: sudo ln -s /etc/nginx/sites-available/lantern-sky /etc/nginx/sites-enabled/
# Va cap SSL bang Certbot: sudo certbot --nginx -d your-domain.com

upstream lantern_sky_app {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;

    # Cho phep upload anh background va anh scan toi 25MB (backend gioi han 20MB)
    client_max_body_size 25M;

    # Nen phan hoi van ban & JSON
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # WebSocket (/ws) cho 200+ client Display & Control
    location /ws {
        proxy_pass http://lantern_sky_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Camera MJPEG stream (tat buffering)
    location /api/camera/stream {
        proxy_pass http://lantern_sky_app;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Tat ca route con lai (UI, API, Display, Generated Thumbnails)
    location / {
        proxy_pass http://lantern_sky_app;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

