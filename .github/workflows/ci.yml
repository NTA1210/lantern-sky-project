name: Lantern Sky CI

on:
  push:
  pull_request:

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install browser test dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Syntax check
        run: python -m py_compile run.py backend/*.py tools/*.py
      - name: Generate all printable templates
        run: python tools/generate_template.py
      - name: Verify printable templates are committed
        run: git diff --exit-code -- print/
      - name: Synthetic CV self-test
        run: python tools/self_test.py
      - name: JavaScript syntax check
        run: |
          node --check frontend/control.js
          node --check frontend/display.js
      - name: Playwright E2E
        run: npm run test:e2e
